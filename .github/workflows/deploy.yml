name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]

# Required for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Install PlantUML and Graphviz
      run: |
        sudo apt-get update
        sudo apt-get install -y plantuml graphviz
      
    - name: Build with Vite
      run: npm run build
      
    - name: Generate gallery
      run: npx vite-node generate_gallery.ts
      
    - name: Prepare pages output
      run: |
        # Copy gallery files and renders into the Vite dist directory
        cp gallery*.html ./dist/
        cp -r local_renders ./dist/
        
    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./dist
        
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
