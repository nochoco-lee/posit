<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Posit - Interactive Diagram</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #f5f5f5;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }
      #app {
        display: flex;
        height: 100vh;
        width: 100vw;
      }
      #editor-panel {
        width: 400px;
        background: #1e1e1e;
        color: #d4d4d4;
        display: flex;
        flex-direction: column;
        border-right: 1px solid #333;
      }
      #editor {
        flex: 1;
        width: 100%;
        background: transparent;
        color: inherit;
        font-family: 'Consolas', 'Courier New', Courier, monospace;
        font-size: 14px;
        border: none;
        padding: 16px;
        resize: none;
        outline: none;
        box-sizing: border-box;
      }
      /* ── Sync Button ─────────────────────────────────────────── */
      #sync-btn {
        background: #2a5a2a;
        color: #7ec87e;
        border: 1px solid #3a7a3a;
        border-radius: 3px;
        font-size: 10px;
        cursor: pointer;
        padding: 2px 8px;
        display: flex;
        align-items: center;
        gap: 5px;
        transition: background 0.2s, color 0.2s;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }
      #sync-btn:hover {
        background: #3a7a3a;
        color: #a0e0a0;
      }
      #sync-btn:disabled {
        opacity: 0.5;
        cursor: default;
      }
      /* ── Diagram-type selector ───────────────────────────────── */
      #diagram-type {
        background: #2d2d2d;
        color: #ccc;
        border: 1px solid #444;
        border-radius: 3px;
        font-size: 10px;
        padding: 2px 4px;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        cursor: pointer;
        outline: none;
      }
      #diagram-type:hover {
        border-color: #666;
      }
      #diagram-type:focus {
        border-color: #569cd6;
      }
      #sync-btn .sync-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #7ec87e;
        flex-shrink: 0;
        transition: background 0.3s;
      }
      #sync-btn.out-of-sync .sync-dot {
        background: #f0c040;
        animation: pulse-dot 1.2s ease-in-out infinite;
      }
      #sync-btn.syncing .sync-dot {
        background: #569cd6;
        animation: pulse-dot 0.5s ease-in-out infinite;
      }
      @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50%       { opacity: 0.4; transform: scale(0.7); }
      }
      #error-panel {
        display: none;
        background: #5a1d1d;
        color: #ffcccc;
        padding: 12px 16px;
        font-size: 13px;
        font-family: 'Consolas', monospace;
        max-height: 200px;
        overflow-y: auto;
        border-top: 1px solid #444;
        white-space: pre-wrap;
      }
      #error-panel.visible {
        display: block;
      }
      #canvas-container {
        flex: 1;
        position: relative;
        background: white;
        overflow: auto;
      }
      .header {
        padding: 12px 16px;
        background: #252526;
        font-weight: 600;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: #cccccc;
        border-bottom: 1px solid #333;
      }

      /* ── Loading Overlay — visible before JS executes ─────────── */
      #loading-overlay {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #1e1e1e;
        z-index: 9999;
        gap: 20px;
        transition: opacity 0.35s ease, visibility 0.35s ease;
      }
      #loading-overlay.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #loading-overlay .logo {
        font-size: 28px;
        font-weight: 700;
        color: #cccccc;
        letter-spacing: 3px;
        font-family: 'Consolas', 'Courier New', monospace;
        animation: logo-pulse 1.6s ease-in-out infinite;
      }
      #loading-overlay .logo span {
        color: #569cd6;
      }
      #loading-overlay .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid #333;
        border-top-color: #569cd6;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      #loading-overlay .status {
        font-size: 12px;
        color: #555;
        font-family: 'Consolas', monospace;
        letter-spacing: 0.5px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      @keyframes logo-pulse {
        0%, 100% { opacity: 1; }
        50%       { opacity: 0.45; }
      }
    </style>
  </head>
  <body>
    <!-- Loading overlay — rendered immediately by the browser, dismissed by JS after init -->
    <div id="loading-overlay" aria-live="polite" aria-label="Loading Posit diagram engine">
      <div class="logo">POS<span>IT</span></div>
      <div class="spinner"></div>
      <div class="status">Loading diagram engine…</div>
    </div>

    <div id="app">
      <div id="editor-panel">
        <div class="header">
          Source
          <div style="float: right; display: flex; gap: 10px; align-items: center;">
            <select id="diagram-type" title="Force a specific diagram type (skips auto-detection)">
              <option value="auto">Auto-detect</option>
              <optgroup label="PlantUML">
                <option value="puml-sequence">Sequence</option>
                <option value="puml-class">Class</option>
                <option value="puml-deployment">Deployment</option>
              </optgroup>
              <optgroup label="Mermaid">
                <option value="mermaid">Mermaid</option>
              </optgroup>
            </select>
            <button id="download-png" style="background: #333; color: #ccc; border: 1px solid #444; border-radius: 3px; font-size: 10px; cursor: pointer; padding: 2px 6px;">PNG</button>
            <button id="download-svg" style="background: #333; color: #ccc; border: 1px solid #444; border-radius: 3px; font-size: 10px; cursor: pointer; padding: 2px 6px;">SVG</button>
            <button id="sync-btn" title="Sync diagram positions back to source code">
              <span class="sync-dot"></span>Sync
            </button>
            <a href="gallery.html" style="color: #aaa; text-decoration: none; font-size: 10px;">Gallery</a>
          </div>
        </div>
        <textarea id="editor" spellcheck="false"></textarea>
        <div id="error-panel"></div>
      </div>
      <div id="canvas-container"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
