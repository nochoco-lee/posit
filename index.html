<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Posit - Interactive Diagram</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
      :root {
        --pos-bg: #ffffff;
        --pos-stroke: #4A5568;
        --pos-node-fill: #FFFFFF;
        --pos-sequence-fill: #E8EDF3;
        --pos-note-fill: #FFF9DB;
        --pos-header-fill: #EDF2F7;
        --pos-box-fill: #EDF2F7;
        --pos-box-top: #E2E8F0;
        --pos-box-side: #CBD5E0;
        --pos-text: #2D3748;
        --pos-arrow-fill: #4A5568;
        --pos-font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        --pos-font-size: 14px;
        --pos-shadow-color: rgba(0,0,0,0.08);
        --pos-shadow-blur: 8px;
        --pos-shadow-offset-x: 0px;
        --pos-shadow-offset-y: 2px;
        --pos-shadow-opacity: 1;
        --pos-stroke-width: 1.5;
        --pos-node-radius: 6;
        --pos-note-radius: 4;
        --pos-box-top-y: 0;
        --pos-box-side-x: 0;
        --pos-font-weight-header: 600;
        --pos-font-weight-body: normal;
        --pos-actor-stroke-width: 2.0;
        --pos-connection-stroke-width: 1.5;
        --pos-node-border-dash: none;
        --pos-lifeline-dash: 5,5;
      }
      [data-theme="dark"] {
        --pos-bg: #1A202C;
        --pos-stroke: #90CDF4;
        --pos-node-fill: #2D3748;
        --pos-sequence-fill: #2D3748;
        --pos-note-fill: #4A5568;
        --pos-header-fill: #2D3748;
        --pos-box-fill: #2D3748;
        --pos-box-top: #4A5568;
        --pos-box-side: #718096;
        --pos-text: #E2E8F0;
        --pos-arrow-fill: #90CDF4;
        --pos-shadow-color: rgba(0,0,0,0.3);
        --pos-shadow-blur: 12px;
      }
      [data-theme="pastel"] {
        --pos-bg: #FFFAF0;
        --pos-stroke: #9F7AEA;
        --pos-node-fill: #FFFFFF;
        --pos-sequence-fill: #F0E6FF;
        --pos-note-fill: #FEFCBF;
        --pos-header-fill: #F5F0FF;
        --pos-box-fill: #F5F0FF;
        --pos-box-top: #E9D8FD;
        --pos-box-side: #D6BCFA;
        --pos-text: #553C9A;
        --pos-arrow-fill: #9F7AEA;
        --pos-shadow-color: rgba(159,122,234,0.15);
        --pos-shadow-blur: 10px;
        --pos-font-family: 'Quicksand', 'Nunito', 'Segoe UI', sans-serif;
        --pos-font-weight-header: 700;
        --pos-font-weight-body: 500;
        --pos-actor-stroke-width: 2.0;
        --pos-connection-stroke-width: 2.0;
        --pos-node-radius: 10;
        --pos-note-radius: 6;
        --pos-stroke-width: 2.0;
        --pos-lifeline-dash: 6,6;
      }
      [data-theme="forest"] {
        --pos-bg: #FAF8F5;
        --pos-stroke: #2F5E42;
        --pos-node-fill: #FAF8F5;
        --pos-sequence-fill: #E2ECE5;
        --pos-activation-fill: #D2E4D8;
        --pos-note-fill: #FCF6E8;
        --pos-header-fill: #E8EFE9;
        --pos-box-fill: #E9EDE9;
        --pos-box-top: #D5E4D9;
        --pos-box-side: #BCCFC0;
        --pos-text: #1C2E24;
        --pos-arrow-fill: #2F5E42;
        --pos-shadow-color: rgba(47,97,68,0.12);
        --pos-shadow-blur: 8px;
        --pos-font-family: 'Georgia', 'Times New Roman', serif;
        --pos-font-weight-header: bold;
        --pos-font-weight-body: normal;
        --pos-actor-stroke-width: 1.5;
        --pos-connection-stroke-width: 1.2;
        --pos-node-radius: 4;
        --pos-note-radius: 2;
        --pos-stroke-width: 1.2;
        --pos-lifeline-dash: 4,4;
      }
      [data-theme="neobrutalist"] {
        --pos-bg: #FFFFFF;
        --pos-stroke: #000000;
        --pos-node-fill: #FDFFB6;
        --pos-sequence-fill: #CAFFBF;
        --pos-activation-fill: #9BF6FF;
        --pos-note-fill: #FFD6A5;
        --pos-header-fill: #FFADAD;
        --pos-box-fill: #E8F0FE;
        --pos-box-top: #E0E0E0;
        --pos-box-side: #B5B5B5;
        --pos-text: #000000;
        --pos-arrow-fill: #000000;
        --pos-shadow-color: #000000;
        --pos-shadow-blur: 0px;
        --pos-shadow-offset-x: 4px;
        --pos-shadow-offset-y: 4px;
        --pos-font-family: 'Consolas', 'Courier New', monospace;
        --pos-font-weight-header: 900;
        --pos-font-weight-body: 700;
        --pos-actor-stroke-width: 3.0;
        --pos-connection-stroke-width: 2.5;
        --pos-node-radius: 0;
        --pos-note-radius: 0;
        --pos-stroke-width: 3.0;
        --pos-lifeline-dash: none;
      }
      [data-theme="sketch"] {
        --pos-bg: #FAFBFD;
        --pos-stroke: #1D3B6F;
        --pos-node-fill: #F4F8FF;
        --pos-sequence-fill: #E3EFFF;
        --pos-activation-fill: #D1E6FF;
        --pos-note-fill: #FFFEE0;
        --pos-header-fill: #EAF2FF;
        --pos-box-fill: #F0F4FA;
        --pos-box-top: #E1EDFC;
        --pos-box-side: #C6DCF9;
        --pos-text: #1D3B6F;
        --pos-arrow-fill: #1D3B6F;
        --pos-shadow-color: rgba(29,59,111,0.06);
        --pos-shadow-blur: 6px;
        --pos-font-family: 'Architects Daughter', 'Comic Sans MS', cursive, sans-serif;
        --pos-font-weight-header: bold;
        --pos-font-weight-body: normal;
        --pos-actor-stroke-width: 2.0;
        --pos-connection-stroke-width: 1.8;
        --pos-node-radius: 8;
        --pos-note-radius: 4;
        --pos-stroke-width: 2.0;
        --pos-lifeline-dash: 12,6;
      }
      [data-theme="mermaid"] {
        --pos-bg: #FFFFFF;
        --pos-stroke: #333333;
        --pos-node-fill: #ECECFF;
        --pos-sequence-fill: #ECECFF;
        --pos-activation-fill: #ECECFF;
        --pos-note-fill: #FFF5AD;
        --pos-header-fill: #ECECFF;
        --pos-box-fill: #F4F4F4;
        --pos-box-top: #E0E0E0;
        --pos-box-side: #CCCCCC;
        --pos-text: #333333;
        --pos-arrow-fill: #333333;
        --pos-shadow-color: rgba(0,0,0,0.05);
        --pos-shadow-blur: 3px;
        --pos-font-family: 'trebuchet ms', verdana, arial, sans-serif;
        --pos-font-weight-header: 600;
        --pos-font-weight-body: normal;
        --pos-actor-stroke-width: 1.5;
        --pos-connection-stroke-width: 1.2;
        --pos-node-radius: 5;
        --pos-note-radius: 2;
        --pos-stroke-width: 1.2;
        --pos-lifeline-dash: 4,4;
      }
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #f5f5f5;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }
      #app {
        display: flex;
        height: 100vh;
        width: 100vw;
      }
      #editor-panel {
        width: 400px;
        background: #1e1e1e;
        color: #d4d4d4;
        display: flex;
        flex-direction: column;
        border-right: 1px solid #333;
      }
      #editor {
        flex: 1;
        width: 100%;
        background: transparent;
        color: inherit;
        font-family: 'Consolas', 'Courier New', Courier, monospace;
        font-size: 14px;
        border: none;
        padding: 16px;
        resize: none;
        outline: none;
        box-sizing: border-box;
      }
      /* ── Sync Button ─────────────────────────────────────────── */
      #sync-btn {
        background: #2a5a2a;
        color: #7ec87e;
        border: 1px solid #3a7a3a;
        border-radius: 3px;
        font-size: 10px;
        cursor: pointer;
        padding: 2px 8px;
        display: flex;
        align-items: center;
        gap: 5px;
        transition: background 0.2s, color 0.2s;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }
      #sync-btn:hover {
        background: #3a7a3a;
        color: #a0e0a0;
      }
      #sync-btn:disabled {
        opacity: 0.5;
        cursor: default;
      }
      /* ── Diagram-type selector ───────────────────────────────── */
      #diagram-type {
        background: #2d2d2d;
        color: #ccc;
        border: 1px solid #444;
        border-radius: 3px;
        font-size: 10px;
        padding: 2px 4px;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        cursor: pointer;
        outline: none;
      }
      #diagram-type:hover {
        border-color: #666;
      }
      #diagram-type:focus {
        border-color: #569cd6;
      }
      #sync-btn .sync-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #7ec87e;
        flex-shrink: 0;
        transition: background 0.3s;
      }
      #sync-btn.out-of-sync .sync-dot {
        background: #f0c040;
        animation: pulse-dot 1.2s ease-in-out infinite;
      }
      #sync-btn.syncing .sync-dot {
        background: #569cd6;
        animation: pulse-dot 0.5s ease-in-out infinite;
      }
      @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50%       { opacity: 0.4; transform: scale(0.7); }
      }
      #error-panel {
        display: none;
        background: #5a1d1d;
        color: #ffcccc;
        padding: 12px 16px;
        font-size: 13px;
        font-family: 'Consolas', monospace;
        max-height: 200px;
        overflow-y: auto;
        border-top: 1px solid #444;
        white-space: pre-wrap;
      }
      #error-panel.visible {
        display: block;
      }
      #timing-panel {
        display: none;
        background: #1a2332;
        color: #8bc34a;
        padding: 6px 16px;
        font-size: 11px;
        font-family: 'Consolas', monospace;
        border-top: 1px solid #333;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        transition: opacity 0.5s ease;
      }
      #timing-panel.visible {
        display: block;
      }
      #timing-panel.fading {
        opacity: 0;
      }
      #timing-panel .phase {
        color: #64b5f6;
      }
      #timing-panel .time {
        color: #8bc34a;
        font-weight: bold;
      }
      #timing-panel .total {
        color: #ffb74d;
        font-weight: bold;
        margin-left: 8px;
      }
      #canvas-container {
        flex: 1;
        position: relative;
        background: var(--pos-bg);
        overflow: auto;
      }
      .header {
        padding: 12px 16px;
        background: #252526;
        font-weight: 600;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: #cccccc;
        border-bottom: 1px solid #333;
      }

      /* ── Loading Overlay — visible before JS executes ─────────── */
      #loading-overlay {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #1e1e1e;
        z-index: 9999;
        gap: 20px;
        transition: opacity 0.35s ease, visibility 0.35s ease;
      }
      #loading-overlay.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #loading-overlay .logo {
        font-size: 28px;
        font-weight: 700;
        color: #cccccc;
        letter-spacing: 3px;
        font-family: 'Consolas', 'Courier New', monospace;
        animation: logo-pulse 1.6s ease-in-out infinite;
      }
      #loading-overlay .logo span {
        color: #569cd6;
      }
      #loading-overlay .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid #333;
        border-top-color: #569cd6;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      #loading-overlay .status {
        font-size: 12px;
        color: #555;
        font-family: 'Consolas', monospace;
        letter-spacing: 0.5px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      @keyframes logo-pulse {
        0%, 100% { opacity: 1; }
        50%       { opacity: 0.45; }
      }
    </style>
  </head>
  <body>
    <!-- Loading overlay — rendered immediately by the browser, dismissed by JS after init -->
    <div id="loading-overlay" aria-live="polite" aria-label="Loading Posit diagram engine">
      <div class="logo">POS<span>IT</span></div>
      <div class="spinner"></div>
      <div class="status">Loading diagram engine…</div>
    </div>

    <div id="app">
      <div id="editor-panel">
        <div class="header">
          Source
          <div style="float: right; display: flex; gap: 10px; align-items: center;">
            <select id="theme-select" title="Choose a color theme" style="background: #2d2d2d; color: #ccc; border: 1px solid #444; border-radius: 3px; font-size: 10px; padding: 2px 4px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; cursor: pointer; outline: none;">
              <option value="light">Light</option>
              <option value="dark">Dark</option>
              <option value="pastel">Pastel</option>
              <option value="forest">Forest</option>
              <option value="neobrutalist">Neobrutalist</option>
              <option value="sketch">Sketch</option>
              <option value="mermaid">Mermaid</option>

            <select id="diagram-type" title="Force a specific diagram type (skips auto-detection)">

              </optgroup>
              <optgroup label="Mermaid">
                <option value="mermaid">Mermaid</option>

              <optgroup label="PlantUML Class">
                <option value="test_scripts/gallery/plantuml_class/advanced_01.puml">Basic 1</option>

                <option value="test_scripts/gallery/plantuml_class/advanced_03.puml">Basic 3</option>
                <option value="test_scripts/gallery/plantuml_class/advanced_04.puml">Basic 4</option>
                <option value="test_scripts/gallery/plantuml_class/advanced_05.puml">Basic 5</option>

                <option value="test_scripts/gallery/plantuml_class/advanced_07.puml">Basic 7</option>

                <option value="test_scripts/gallery/plantuml_class/advanced_10.puml">Basic 10</option>

              <optgroup label="PlantUML Deployment">
                <option value="test_scripts/gallery/plantuml_deployment/advanced_01.puml">Basic 1</option>
                <option value="test_scripts/gallery/plantuml_deployment/advanced_02.puml">Basic 2</option>

                <option value="test_scripts/gallery/plantuml_deployment/advanced_06.puml">Basic 6</option>
                <option value="test_scripts/gallery/plantuml_deployment/advanced_07.puml">Basic 7</option>

                <option value="test_scripts/gallery/plantuml_deployment/advanced_09.puml">Basic 9</option>
                <option value="test_scripts/gallery/plantuml_deployment/advanced_10.puml">Basic 10</option>
              </optgroup>
              <optgroup label="Mermaid Sequence">
                <option value="test_scripts/gallery/mermaid_sequence/advanced_01.mmd">Basic 1</option>

                <option value="test_scripts/gallery/mermaid_sequence/advanced_07.mmd">Basic 7</option>
                <option value="test_scripts/gallery/mermaid_sequence/advanced_08.mmd">Basic 8</option>
                <option value="test_scripts/gallery/mermaid_sequence/advanced_09.mmd">Basic 9</option>
                <option value="test_scripts/gallery/mermaid_sequence/advanced_10.mmd">Basic 10</option>
              </optgroup>
              <optgroup label="Mermaid Class">
                <option value="test_scripts/gallery/mermaid_class/advanced_01.mmd">Basic 1</option>

                <option value="test_scripts/gallery/mermaid_flowchart/advanced_01.mmd">Basic 1</option>

                <option value="test_scripts/gallery/mermaid_flowchart/advanced_03.mmd">Basic 3</option>

                <option value="test_scripts/gallery/mermaid_flowchart/advanced_05.mmd">Basic 5</option>
                <option value="test_scripts/gallery/mermaid_flowchart/advanced_06.mmd">Basic 6</option>
                <option value="test_scripts/gallery/mermaid_flowchart/advanced_07.mmd">Basic 7</option>
                <option value="test_scripts/gallery/mermaid_flowchart/advanced_08.mmd">Basic 8</option>
                <option value="test_scripts/gallery/mermaid_flowchart/advanced_09.mmd">Basic 9</option>
                <option value="test_scripts/gallery/mermaid_flowchart/advanced_10.mmd">Basic 10</option>
              </optgroup>
            </select>
            <button id="download-png" style="background: #333; color: #ccc; border: 1px solid #444; border-radius: 3px; font-size: 10px; cursor: pointer; padding: 2px 6px;">PNG</button>
            <button id="download-svg" style="background: #333; color: #ccc; border: 1px solid #444; border-radius: 3px; font-size: 10px; cursor: pointer; padding: 2px 6px;">SVG</button>
            <button id="sync-btn" title="Sync diagram positions back to source code">
              <span class="sync-dot"></span>Sync
            </button>
            <a href="gallery.html" style="color: #aaa; text-decoration: none; font-size: 10px;">Gallery</a>
          </div>
        </div>
        <textarea id="editor" spellcheck="false"></textarea>
        <div id="error-panel"></div>
        <div id="timing-panel"></div>
      </div>
      <div id="canvas-container"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
