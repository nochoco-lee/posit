<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Posit - Interactive Diagram</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #f5f5f5;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }
      #app {
        display: flex;
        height: 100vh;
        width: 100vw;
      }
      #editor-panel {
        width: 400px;
        background: #1e1e1e;
        color: #d4d4d4;
        display: flex;
        flex-direction: column;
        border-right: 1px solid #333;
      }
      #editor {
        flex: 1;
        width: 100%;
        background: transparent;
        color: inherit;
        font-family: 'Consolas', 'Courier New', Courier, monospace;
        font-size: 14px;
        border: none;
        padding: 16px;
        resize: none;
        outline: none;
        box-sizing: border-box;
      }
      #error-panel {
        display: none;
        background: #5a1d1d;
        color: #ffcccc;
        padding: 12px 16px;
        font-size: 13px;
        font-family: 'Consolas', monospace;
        max-height: 200px;
        overflow-y: auto;
        border-top: 1px solid #444;
        white-space: pre-wrap;
      }
      #error-panel.visible {
        display: block;
      }
      #canvas-container {
        flex: 1;
        position: relative;
        background: white;
      }
      .header {
        padding: 12px 16px;
        background: #252526;
        font-weight: 600;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: #cccccc;
        border-bottom: 1px solid #333;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="editor-panel">
        <div class="header">
          Source (PlantUML)
          <a href="gallery.html" style="float: right; color: #aaa; text-decoration: none; font-size: 10px;">Gallery</a>
        </div>
        <textarea id="editor" spellcheck="false">
@startuml
Alice -> Bob: Hello
Bob -> Alice: Hi!
@enduml
        </textarea>
        <div id="error-panel"></div>
      </div>
      <div id="canvas-container"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
